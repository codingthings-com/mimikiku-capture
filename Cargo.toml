[package]
name = "mimikiku-capture"
version = "0.1.0"
edition = "2024"
authors = ["codingthings <hello@codingthings.com>"]
license = "Apache-2.0"

[lib]
name = "mimikiku_capture"
path = "src/lib/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
cpal = "0.18"
base64 = "0.23"
clap = { version = "4.0", features = ["derive", "env"] }
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dotenvy = "0.15.7"
